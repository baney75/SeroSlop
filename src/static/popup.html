<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ProofLens</title>
    <style>
      :root { color-scheme: light dark; font: 14px/1.4 system-ui, sans-serif; }
      body { margin: 0; width: 320px; background: Canvas; color: CanvasText; }
      header, main, footer { padding: 16px; }
      header { background: #171b2c; color: #fff; }
      h1 { font-size: 18px; margin: 0 0 4px; } p { margin: 0; }
      .status { color: #81f4c5; font-weight: 700; }
      .summary { margin-bottom: 16px; }
      label { align-items: center; display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; }
      button { width: 100%; margin-top: 12px; padding: 9px; }
      footer { border-top: 1px solid color-mix(in srgb, CanvasText 18%, transparent); }
      a { color: LinkText; }
    </style>
  </head>
  <body>
    <header><h1>ProofLens</h1><p id="model-status" class="status">Checking setup…</p></header>
    <main>
      <p id="page-summary" class="summary">Reading this page…</p>
      <label><span>Analyze this site</span><input id="site-enabled" type="checkbox" disabled></label>
      <label><span>Show labels in this tab</span><input id="labels-visible" type="checkbox" disabled></label>
      <button id="rescan" type="button">Re-scan page</button>
    </main>
    <footer><a id="open-setup" href="setup.html">Setup and model details</a></footer>
    <script src="popup.js"></script>
  </body>
</html>
