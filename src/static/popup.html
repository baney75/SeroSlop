<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SeroSlop</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --accent: #ef333b;
        --background: #f6f7fa;
        --surface: #fff;
        --text: #18202c;
        --muted: #667085;
        --border: #e1e5ec;
        --button: #172033;
        --button-text: #fff;
        --ready: #087443;
        --error: #b42318;
        --focus: #2563eb;
      }
      * { box-sizing: border-box; }
      body { background: var(--background); color: var(--text); margin: 0; min-width: 320px; width: 360px; }
      [hidden] { display: none !important; }
      header, main, footer { padding: 16px; }
      header { align-items: center; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; gap: 12px; }
      .brand-mark { border-radius: 10px; flex: 0 0 36px; height: 36px; object-fit: contain; width: 36px; }
      h1 { font-size: 18px; letter-spacing: -.02em; margin: 0 0 2px; }
      h2 { font-size: 16px; letter-spacing: -.015em; margin: 0; }
      p { margin: 0; }
      .status { color: var(--ready); font-size: 13px; font-weight: 700; }
      .status[data-state="error"] { color: var(--error); }
      .context { color: var(--muted); font-size: 12px; margin-bottom: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mode-row { align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; display: flex; gap: 12px; justify-content: space-between; margin-bottom: 12px; min-height: 56px; padding: 10px 12px; }
      .mode-label { color: var(--muted); display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
      #mode-summary { display: block; font-weight: 750; }
      .summary { margin-bottom: 10px; }
      .feedback { color: var(--muted); font-size: 12px; min-height: 20px; }
      .feedback[data-state="error"] { color: var(--error); }
      .sr-only { clip: rect(0 0 0 0); clip-path: inset(50%); height: 1px; overflow: hidden; position: absolute; white-space: nowrap; width: 1px; }
      button, a { -webkit-tap-highlight-color: transparent; }
      button { border: 0; border-radius: 10px; cursor: pointer; font: inherit; font-weight: 740; min-height: 44px; }
      button:focus-visible, a:focus-visible { outline: 3px solid color-mix(in srgb, var(--focus) 40%, transparent); outline-offset: 3px; }
      button:disabled { cursor: default; opacity: .5; }
      .text-button { background: transparent; color: var(--text); min-width: 64px; padding: 8px 10px; }
      .primary { background: var(--button); color: var(--button-text); margin-top: 10px; padding: 10px 14px; width: 100%; }
      .sheet-head { align-items: center; display: flex; gap: 8px; justify-content: space-between; margin-bottom: 12px; }
      fieldset { border: 0; margin: 0; padding: 0; }
      legend { font-weight: 750; margin-bottom: 8px; }
      .mode-option { align-items: flex-start; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; display: flex; gap: 10px; margin-top: 8px; min-height: 58px; padding: 10px 12px; }
      .mode-option:has(input:checked) { background: color-mix(in srgb, var(--accent) 8%, var(--surface)); border: 2px solid var(--accent); padding: 9px 11px; }
      .mode-option:has(input:focus-visible) { outline: 3px solid color-mix(in srgb, var(--focus) 40%, transparent); outline-offset: 3px; }
      .mode-option input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      .mode-option input { margin: 4px 0 0; }
      .mode-option strong, .mode-option small { display: block; }
      .mode-option small { color: var(--muted); margin-top: 2px; }
      footer { border-top: 1px solid var(--border); }
      footer a { align-items: center; color: var(--text); display: inline-flex; min-height: 44px; }
      @media (prefers-color-scheme: dark) {
        :root { --background: #0c1018; --surface: #141b27; --text: #f3f5f8; --muted: #a8b0be; --border: #2b3544; --button: #e9eef7; --button-text: #111827; --ready: #81f4c5; --error: #ffb4ab; }
      }
      @media (max-width: 340px) {
        body { width: 320px; }
        .mode-row { align-items: stretch; flex-direction: column; gap: 2px; }
        .text-button { align-self: flex-start; }
      }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <header><img class="brand-mark" src="seroslop.svg" alt=""><div><h1>SeroSlop</h1><p id="model-status" class="status">Checking setup…</p></div></header>
    <main>
      <section id="summary-view" aria-label="Page scan controls">
        <p id="site-context" class="context" title="">No supported site selected</p>
        <div class="mode-row"><div><span class="mode-label">Mode</span><span id="mode-summary">Choose a mode</span></div><button id="change-mode" class="text-button" type="button">Change</button></div>
        <p id="page-summary" class="summary">Reading this page…</p>
        <p id="control-feedback" class="feedback" role="status" aria-live="polite"></p>
        <button id="primary-action" class="primary" type="button" disabled>This page can’t be scanned</button>
      </section>
      <section id="mode-sheet" hidden aria-labelledby="mode-sheet-heading">
        <div class="sheet-head"><h2 id="mode-sheet-heading">Scanning mode</h2><button id="mode-back" class="text-button" type="button">Back</button></div>
        <fieldset>
          <legend class="sr-only">Scanning mode</legend>
          <label class="mode-option"><input type="radio" name="popup-mode" value="pick"><span><strong>Choose an image</strong><small>Pick one image when you want a score.</small></span></label>
          <label class="mode-option"><input type="radio" name="popup-mode" value="main"><span><strong>Main images</strong><small>Scan images in the page’s main content.</small></span></label>
          <label class="mode-option"><input type="radio" name="popup-mode" value="all"><span><strong>Every image</strong><small>Scan all supported page images.</small></span></label>
        </fieldset>
        <p id="mode-error" class="feedback" role="status" aria-live="polite"></p>
        <button id="save-mode" class="primary" type="button" disabled>Save mode</button>
      </section>
    </main>
    <footer><a id="open-setup" href="setup.html">Setup and model details</a></footer>
    <script src="popup.js"></script>
  </body>
</html>
