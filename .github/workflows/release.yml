name: release

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: benchmark/verify-requirements.txt
      - run: python -m pip install --disable-pip-version-check -r benchmark/verify-requirements.txt
      - run: npm ci
      - run: npm run verify:static
      - run: ./node_modules/.bin/playwright-core install --with-deps chromium
      - name: Verify extension behavior in a clean browser
        run: xvfb-run --auto-servernum npm run test:chrome
      - name: Prepare stable asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/prepare-release-assets.mjs stable "$GITHUB_SHA" "$GITHUB_REF_NAME"
      - name: Prepare nightly asset
        if: github.ref == 'refs/heads/main'
        run: node scripts/prepare-release-assets.mjs nightly "$GITHUB_SHA" "$GITHUB_REF_NAME"
      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=$(node -p 'JSON.parse(require("fs").readFileSync("release/publish/release-metadata.json","utf8")).archive')
          checksum=$(node -p 'JSON.parse(require("fs").readFileSync("release/publish/release-metadata.json","utf8")).checksum')
          gh release create "$GITHUB_REF_NAME" "release/publish/$archive" "release/publish/$checksum" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest --generate-notes --title "SeroSlop ${GITHUB_REF_NAME#v}"
      - name: Publish immutable nightly prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=$(node -p 'JSON.parse(require("fs").readFileSync("release/publish/release-metadata.json","utf8")).archive')
          checksum=$(node -p 'JSON.parse(require("fs").readFileSync("release/publish/release-metadata.json","utf8")).checksum')
          tag="nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::12}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          gh release create "$tag" "release/publish/$archive" "release/publish/$checksum" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "SeroSlop nightly ${GITHUB_SHA::12}" \
            --notes "Developer build from commit $GITHUB_SHA. Unzip it, load the folder with Chrome's Load unpacked action, and replace/reload it manually for updates."
